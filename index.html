<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徳之島集落パズル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>徳之島集落パズル</h1>
  <p class="tagline">集落名カードを地図の正しい場所に置こう</p>
  <nav id="stage-tabs" aria-label="ステージ選択"></nav>
</header>

<main>
  <div id="map-wrap">
    <svg id="map" viewBox="0 0 100 120" role="img" aria-label="徳之島のデフォルメ地図">
      <defs>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ed3e8"/>
          <stop offset="1" stop-color="#4aa8cc"/>
        </linearGradient>
      </defs>
      <rect x="-10" y="-10" width="120" height="140" fill="url(#sea)"/>
      <path id="island" d="
        M 38 6
        Q 50 3 62 8
        Q 70 12 70 18
        Q 76 24 78 30
        Q 82 36 80 42
        Q 84 48 84 55
        Q 88 60 87 66
        Q 90 70 88 76
        Q 89 82 86 84
        Q 82 88 78 88
        Q 72 92 66 94
        Q 62 97 56 97
        Q 50 99 44 96
        Q 38 95 34 92
        Q 26 90 22 86
        Q 17 82 16 76
        Q 12 70 12 64
        Q 10 58 11 52
        Q 10 46 12 42
        Q 12 36 14 32
        Q 15 26 18 22
        Q 20 17 24 14
        Q 27 10 30 8
        Q 34 6 38 6
        Z"/>
      <g id="borders" aria-hidden="true">
        <path d="M 42 7 Q 48 30 50 58" class="border"/>
        <path d="M 50 58 Q 36 70 24 82" class="border"/>
        <path d="M 50 58 Q 66 74 80 87" class="border"/>
      </g>
      <g id="town-labels" aria-hidden="true">
        <text x="63" y="38" class="town-label">徳之島町</text>
        <text x="24" y="40" class="town-label">天城町</text>
        <text x="44" y="86" class="town-label">伊仙町</text>
      </g>
      <g id="slots"></g>
    </svg>
  </div>

  <div id="status">
    <span id="remaining"></span>
  </div>

  <div id="tray"></div>
</main>

<div id="clear-overlay" hidden>
  <div class="clear-box">
    <p class="clear-title">クリア</p>
    <p id="clear-stage"></p>
    <button id="retry">もう一回</button>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
