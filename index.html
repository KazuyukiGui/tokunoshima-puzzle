<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徳之島集落パズル</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>徳之島集落パズル</h1>
  <p class="tagline">集落名カードを地図の正しい場所へ — ドラッグ、またはカードをタップ→地図をタップ</p>
  <nav id="stage-tabs" aria-label="ステージ選択"></nav>
</header>

<main>
  <div id="map-wrap">
    <svg id="map" viewBox="0 0 100 157.5" role="img" aria-label="徳之島の地図">
      <defs>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ed3e8"/>
          <stop offset="1" stop-color="#4aa8cc"/>
        </linearGradient>
      </defs>
      <rect x="-10" y="-10" width="120" height="180" fill="url(#sea)"/>
      <path id="island" d=""/>
      <g id="borders" aria-hidden="true"></g>
      <g id="town-labels" aria-hidden="true">
        <text x="78" y="42" class="town-label">徳之島町</text>
        <text x="13" y="60" class="town-label">天城町</text>
        <text x="26" y="140" class="town-label">伊仙町</text>
      </g>
      <g id="slots"></g>
    </svg>
  </div>

  <div id="status">
    <span id="remaining"></span>
  </div>

  <div id="tray-wrap">
    <div id="tray"></div>
  </div>
</main>

<div id="clear-overlay" hidden>
  <div class="clear-box">
    <p class="clear-title">クリア</p>
    <p id="clear-stage"></p>
    <button id="retry">もう一回</button>
  </div>
</div>

<script src="map-paths.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
<script data-goatcounter="https://tokunoshima-puzzle.goatcounter.com/count" async src="count.js"></script>
</body>
</html>
